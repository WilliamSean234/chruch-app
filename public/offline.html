<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3037a8">
  <title>Tidak ada koneksi — Pelayanan</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f4f9; color: #171a2c; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 360px; background: #fff; border: 1px solid #e3e5f0; border-radius: 24px; padding: 32px 28px; text-align: center; box-shadow: 0 20px 60px -30px rgba(48,55,168,.35); }
    h1 { margin: 16px 0 8px; font-size: 22px; letter-spacing: -0.01em; }
    p { margin: 0 0 24px; font-size: 14.5px; line-height: 1.55; color: #565b76; }
    button { height: 48px; width: 100%; border: 0; border-radius: 12px; background: #3037a8; color: #fff; font: inherit; font-size: 15px; font-weight: 700; }
    button:active { filter: brightness(1.1); }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="88" height="88" style="border-radius:20px">
    <h1>Tidak ada koneksi</h1>
    <p>Jadwal dan data gereja hanya bisa dibuka saat HP tersambung ke internet. Periksa sinyal atau Wi-Fi, lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
